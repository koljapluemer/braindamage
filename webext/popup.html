<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; width: 900px; padding: 10px; font-size: 0.85rem; }
  button { padding: 6px 16px; font-size: 0.9rem; cursor: pointer; }
  #status { margin-top: 8px; font-size: 0.85rem; white-space: pre-wrap; }
  .ok { color: #0ca30c; }
  .err { color: #d03b3b; }
  #table-wrap { margin-top: 12px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid rgba(128, 128, 128, 0.35); padding: 4px 10px; text-align: right; white-space: nowrap; }
  th { text-align: center; }
  th a { color: inherit; text-decoration: none; }
  th a:hover { text-decoration: underline; }
  td:first-child, th:first-child { text-align: left; }
  .ev-cell { font-weight: 700; }
  .c-purple { background: rgba(139, 92, 246, 0.35); }
  .c-green { background: rgba(34, 197, 94, 0.35); }
  .c-orange { background: rgba(249, 115, 22, 0.35); }
  .c-grey { background: rgba(156, 163, 175, 0.35); }
</style>
</head>
<body>
<button id="fetch-btn">Fetch offers from this page</button>
<div id="status"></div>
<div id="table-wrap"></div>
<script src="popup.js"></script>
</body>
</html>
